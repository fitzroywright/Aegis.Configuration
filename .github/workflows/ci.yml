name: ci

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: Aegis.Configuration
      - uses: actions/checkout@v4
        with:
          repository: fitzroywright/Common.Diagnostics
          path: Common.Diagnostics
      - uses: actions/checkout@v4
        with:
          repository: fitzroywright/Common.Secrets
          path: Common.Secrets
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Test
        working-directory: Aegis.Configuration
        run: dotnet test tests/Aegis.Configuration.Tests/Aegis.Configuration.Tests.csproj --configuration Release
      - name: Build Web
        working-directory: Aegis.Configuration
        run: dotnet build src/Aegis.Configuration.Web/Aegis.Configuration.Web.csproj --configuration Release
