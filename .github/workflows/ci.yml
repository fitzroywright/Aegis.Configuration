name: ci

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: security_tests
          POSTGRES_PASSWORD: isolated_ci_only
          POSTGRES_DB: security_tests
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U security_tests -d security_tests"
          --health-interval 10s --health-timeout 5s --health-retries 5
    env:
      CONFIGURATION_TEST_POSTGRES: Host=localhost;Port=5432;Database=security_tests;Username=security_tests;Password=isolated_ci_only
    steps:
      - uses: actions/checkout@v4
        with:
          path: Aegis.Configuration
      - uses: actions/checkout@v4
        with:
          repository: fitzroywright/Common.Secrets
          ref: 0e081a55d5885a148decb0c86c1baad263448948
          path: Common/Common.Secrets
      - uses: actions/checkout@v4
        with:
          repository: fitzroywright/Common.Security
          ref: 12247599fe75d6aeb0a2e4ff58c66349fe976e63
          path: Common/Common.Security
      - uses: actions/checkout@v4
        with:
          repository: fitzroywright/Common.Diagnostics
          ref: 4f90c9fd31aaa16ffbada97e33084a5356a45859
          path: Common/Common.Diagnostics
      - uses: actions/checkout@v4
        with:
          repository: fitzroywright/Common.Registration
          ref: e673815b7e1f29ac1c713e849762e1af522a784d
          path: Common/Common.Registration
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Test Debug
        working-directory: Aegis.Configuration
        run: dotnet test Aegis.Configuration.Tests/Aegis.Configuration.Tests.csproj --configuration Debug

      - name: Build Web Debug
        working-directory: Aegis.Configuration
        run: dotnet build Aegis.Configuration.Web/Aegis.Configuration.Web.csproj --configuration Debug

      - name: Test Release
        working-directory: Aegis.Configuration
        shell: bash
        run: |
          set +e
          dotnet test Aegis.Configuration.Tests/Aegis.Configuration.Tests.csproj --configuration Release 2>&1 | tee test.log
          code=${PIPESTATUS[0]}
          exit "$code"

      - name: Build Web Release
        working-directory: Aegis.Configuration
        shell: bash
        run: |
          set +e
          dotnet build Aegis.Configuration.Web/Aegis.Configuration.Web.csproj --configuration Release 2>&1 | tee web-build.log
          code=${PIPESTATUS[0]}
          exit "$code"

      - name: Upload CI logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-logs
          path: |
            Aegis.Configuration/test.log
            Aegis.Configuration/web-build.log
          if-no-files-found: ignore
